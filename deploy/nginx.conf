# =============================================================================
# Monevra — Nginx reverse proxy (HTTPS)
#
# Cara pakai (di server, Ubuntu/Debian):
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/monevra
#   2. GANTI "api.domainkamu.com" -> domain kamu
#   3. sudo ln -s /etc/nginx/sites-available/monevra /etc/nginx/sites-enabled/
#   4. sudo nginx -t          (uji konfigurasi)
#   5. sudo systemctl reload nginx
#
# SSL: pakai certbot (lihat DEPLOY.md) — otomatis mengisi
#      /etc/letsencrypt/live/<domain>/... di bawah.
# =============================================================================

# ---- Redirect HTTP -> HTTPS -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.domainkamu.com;

    # Biarkan certbot mengakses path tantangan http-01
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.domainkamu.com;

    # Sertifikat (dibuat otomatis oleh: sudo certbot --nginx)
    ssl_certificate     /etc/letsencrypt/live/api.domainkamu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.domainkamu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Upload struk (multer 5MB) — beri ruang lega
    client_max_body_size 10m;

    # Security headers (sebagian juga di-set helmet di app)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---- Proxy ke backend Node (port 3001) ----------------------------------
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (kalau nanti dipakai)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Timeout
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Jangan buffer berlebihan untuk SSE/streaming
        proxy_buffering off;
    }
}
