# Konfigurasi electron-builder untuk Monevra Desktop
appId: com.monevra.desktop
productName: Monevra
copyright: Copyright © 2026 Monevra

# File yang masuk ke dalam app.asar (kode Electron saja)
files:
  - main.js
  - preload.js
  - assets/icon.png
  - package.json

# Sumber daya tambahan di luar app.asar — ditaruh di resources/
extraResources:
  # Backend Express Monevra — ambil dari vendor/ (staging siap-package)
  # yang SUDAH berisi node_modules. electron-builder mengecualikan node_modules
  # dari extraResources kalau from-nya folder project, jadi kita staging dulu.
  - from: vendor/backend
    to: backend
    filter:
      - "**/*"
  # Frontend build (hasil npm run build)
  - from: ../frontend/dist
    to: frontend/dist
  # Node.js runtime untuk spawn backend (Windows)
  - from: node.exe
    to: node.exe

# Ikon aplikasi
icon: assets/icon.ico

# Target Windows
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  executableName: Monevra

# Installer NSIS
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Monevra
  artifactName: Monevra-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

# Direktori output
directories:
  output: release

