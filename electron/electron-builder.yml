# Konfigurasi electron-builder untuk Monevra Desktop
appId: com.monevra.desktop
productName: Monevra
copyright: Copyright © 2026 Monevra

# File yang masuk ke dalam app.asar (kode Electron saja)
files:
  - main.js
  - preload.js
  - assets/icon.png
  - package.json

# Sumber daya tambahan di luar app.asar — ditaruh di resources/
extraResources:
  # Backend Express Monevra — ambil dari vendor/ (staging siap-package)
  # yang SUDAH berisi node_modules. electron-builder mengecualikan node_modules
  # dari extraResources kalau from-nya folder project, jadi kita staging dulu.
  # Isi vendor/ di-generate oleh `node scripts/setup.mjs` (JANGAN di-commit).
  - from: vendor/backend
    to: backend
    filter:
      - "**/*"
  # Frontend build (hasil npm run build, di-generate juga oleh setup.mjs)
  - from: ../frontend/dist
    to: frontend/dist
  # NOTE: node.exe (runtime backend Windows) TIDAK ditaruh di sini. Itu kamu taruh
  # di blok `win.extraResources` (khusus Windows). Kalau ditaruh global, build macOS
  # akan gagal karena mencoba menyalin node.exe (file Windows .exe).

# Ikon aplikasi
# Windows: icon.ico | macOS: electron-builder generate .icns dari icon-1024.png
icon: assets/icon.png

# Target macOS — build WAJIB dijalankan di mesin macOS (electron-builder tidak bisa
# cross-build dmg dari Windows). Arch: arm64 (Apple Silicon M1/M2/M3) + x64 (Intel).
# `universal` = gabungan dua-duanya dalam satu .app, tapi butuh lipo & waktu build 2x.
# Default: dua artefak terpisah (paling fleksibel utk distribusi).
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: assets/icon-1024.png
  category: public.app-category.finance
  darkModeSupport: true
  artifactName: Monevra-${version}-${arch}.${ext}

# Target Windows
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  executableName: Monevra
  # Runtime node.exe khusus Windows (spawn backend, path absolut).
  # macOS pakai `resolveNodeBin()` di main.js: cari node di path absolut umum
  # (/opt/homebrew/bin, /usr/local/bin, nvm) — TIDAK andalkan PATH (app yang dibuka
  # dari Finder tidak mewarisi PATH terminal → spawn ENOENT).
  extraResources:
    - from: node.exe
      to: node.exe

# Installer NSIS
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Monevra
  artifactName: Monevra-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

# Direktori output
directories:
  output: release

# Publikasi (auto-update) — kosong dulu, diisi saat server update tersedia
