# Konfigurasi electron-builder Monevra — MODE LOKAL (default)
# App membawa backend Express + Node sendiri → butuh MySQL di komputer user.
# Untuk app klien ke backend hosting (ringan, tanpa MySQL): pakai
# `npm run build:mac:online` / `npm run build:online` (electron-builder.online.yml).
extends: ./electron-builder.base.yml

# Sumber daya tambahan di luar app.asar — ditaruh di resources/
extraResources:
  # Backend Express Monevra — ambil dari vendor/ (staging siap-package)
  # yang SUDAH berisi node_modules. electron-builder mengecualikan node_modules
  # dari extraResources kalau from-nya folder project, jadi kita staging dulu.
  # Isi vendor/ di-generate oleh `node scripts/setup.mjs` (JANGAN di-commit).
  - from: vendor/backend
    to: backend
    filter:
      - "**/*"
  # Frontend build (hasil npm run build, di-generate juga oleh setup.mjs)
  - from: ../frontend/dist
    to: frontend/dist

mac:
  # Binary Node ikut di-bundle → app TIDAK bergantung Node/PATH di mesin user.
  # `scripts/setup.mjs` menyalin node ke electron/node-<arch> saat setup di macOS.
  # (kalau file tidak ada, electron-builder hanya warn → fallback ke resolveNodeBin)
  extraResources:
    - from: node-${arch}
      to: node

win:
  # Runtime node.exe khusus Windows (spawn backend, path absolut).
  # macOS pakai `resolveNodeBin()` di main.js: cari node di path absolut umum
  # (/opt/homebrew/bin, /usr/local/bin, nvm) — TIDAK andalkan PATH (app yang dibuka
  # dari Finder tidak mewarisi PATH terminal → spawn ENOENT).
  extraResources:
    - from: node.exe
      to: node.exe
